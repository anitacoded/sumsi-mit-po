<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--cream)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.p{border-radius:12px;padding:14px;border:2px solid var(--espresso);font:600 17px var(--font-display);min-height:64px}.p small{display:block;font:500 12px var(--font-body);margin-top:6px}</style></head><body><div class="r"><div class="p" style="background:var(--cream);color:var(--espresso)">Espresso/Creme<small>Fließtext · 10.7:1</small></div><div class="p" style="background:var(--deep-plum);color:var(--cream)">Creme/Plum<small>Buttons · 7.8:1</small></div><div class="p" style="background:var(--lilac);color:var(--espresso)">Espresso/Flieder<small>Kacheln · 6.1:1</small></div><div class="p" style="background:var(--espresso);color:var(--cream)">Creme/Espresso<small>Dunkle Fläche</small></div><div class="p" style="background:var(--mauve);color:var(--espresso)">Espresso/Mauve<small>Akzentkachel · 5.5:1</small></div><div class="p" style="background:var(--light-lavender);color:var(--deep-plum)">Plum/Lavendel<small>Aktiv, Hinweis · 7.0:1</small></div><div class="p" style="background:var(--cream);color:var(--purple)">Purple/Creme<small>3.5:1 · nur ≥ 24px</small></div><div class="p" style="background:var(--cream);color:var(--mauve)">Mauve/Creme<small style="color:var(--espresso)">1.9:1 · nie als Schrift</small></div></div></body></html>
