<!-- @dsCard group="Spacing" viewport="700x160" name="Bewegung" subtitle="Atem-Easing, ruhig; reduced-motion respektiert" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--cream)}.r{display:flex;gap:40px;align-items:center}.c{width:90px;height:90px;border-radius:50%;background:var(--lilac);border:2px solid var(--espresso);animation:b 6s var(--ease-breath) infinite}.d{width:12px;height:12px;border-radius:50%;background:var(--deep-plum)}@keyframes b{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.c{animation:none}}.t{font:13px/1.6 var(--font-body)}code{font-weight:600}</style></head><body><div class="r"><div class="c"></div><div class="t"><code>--ease-breath</code> cubic-bezier(.45,0,.55,1) – Atemkreis, Punkt am Quadrat<br><code>--ease-out</code> 200ms – Buttons, Panels<br><code>prefers-reduced-motion</code> → keine Skalierung, nur Zahl & Phase</div></div></body></html>
