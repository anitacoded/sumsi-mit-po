<!-- @dsCard group="Colors" viewport="700x210" name="Semantische Tokens" subtitle="Aliase für Text, Flächen, Aktionen" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--cream)}.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}.t{display:flex;align-items:center;gap:10px;font:13px var(--font-body)}.t i{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--espresso);flex:none}code{font:500 13px var(--font-body);color:var(--espresso)}.t span{color:var(--text-muted)}</style></head><body><div class="g"><div class="t"><i style="background:var(--text-body)"></i><code>--text-body</code><span>Espresso</span></div><div class="t"><i style="background:var(--text-accent)"></i><code>--text-accent</code><span>Deep Plum</span></div><div class="t"><i style="background:var(--surface-page)"></i><code>--surface-page</code><span>Cream</span></div><div class="t"><i style="background:var(--surface-calm)"></i><code>--surface-calm</code><span>Light Lavender</span></div><div class="t"><i style="background:var(--surface-tile-1)"></i><code>--surface-tile-1</code><span>Lilac</span></div><div class="t"><i style="background:var(--surface-tile-3)"></i><code>--surface-tile-3</code><span>Mauve</span></div><div class="t"><i style="background:var(--action-primary)"></i><code>--action-primary</code><span>Deep Plum</span></div><div class="t"><i style="background:var(--action-primary-hover)"></i><code>--action-primary-hover</code><span>Espresso</span></div><div class="t"><i style="background:var(--state-progress)"></i><code>--state-progress</code><span>Purple</span></div><div class="t"><i style="background:var(--state-track)"></i><code>--state-track</code><span>Lilac</span></div><div class="t"><i style="background:var(--focus-ring)"></i><code>--focus-ring</code><span>Deep Plum</span></div><div class="t"><i style="background:var(--border-soft)"></i><code>--border-soft</code><span>Espresso 22%</span></div></div></body></html>
